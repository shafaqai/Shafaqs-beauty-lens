<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shafaq’s Beauty Lens</title>
<style>
:root{--bg:#fdf6f3;--card:#fff;--ink:#3b2a30;--rose:#b4506a;--soft:#f3dfe3;--mut:#7d6a70}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:520px;margin:auto;padding:20px}h1{font-family:Georgia,serif;color:var(--rose);margin:8px 0 4px}
p.s{color:var(--mut);margin:0 0 16px}.card{background:var(--card);border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 2px 10px #b4506a18}
button,label.b{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--rose);color:#fff;font-size:16px;text-align:center;margin:8px 0;cursor:pointer}
button.o{background:var(--soft);color:var(--rose)}img#pv{width:100%;border-radius:14px;display:none;margin-bottom:8px}
.row{margin:10px 0}.bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--rose)}
.h{display:flex;justify-content:space-between;font-size:14px}.rec{border-left:4px solid var(--rose);padding:6px 10px;margin:10px 0;background:var(--bg);border-radius:6px}
small{color:var(--mut)}#qr{display:flex;justify-content:center;margin-top:8px}#msg{color:#a33;min-height:20px}
</style></head><body><main>
<h1>Shafaq’s Beauty Lens</h1><p class="s">Selfie skin analysis + personalised skincare picks, in one step.</p>
<div class="card">
<img id="pv" alt="">
<label class="b">📷 Take / choose a selfie<input id="f" type="file" accept="image/*" capture="user" hidden></label>
<button id="go" disabled>Analyse my skin (live AI)</button>
<button class="o" id="demo">See a sample result (demo)</button>
<div id="msg"></div>
<small>Tips: front-facing, even light, no makeup, hair off forehead. Powered by YouCam API.</small>
</div>
<div id="out"></div>
<div class="card"><b>Share this app</b><div id="qr"></div></div>
<small>Not medical advice. Your photo is sent only for analysis and is not stored by this app.</small>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// Edit this list: each skincare client can put their own products here.
const CONCERNS={
 acne:{label:"Acne & breakouts",product:"Gentle salicylic-acid cleanser + oil-free gel moisturiser",tip:"Cleanse twice daily; avoid touching your face."},
 moisture:{label:"Hydration",product:"Hyaluronic-acid serum + ceramide cream",tip:"Apply on slightly damp skin and drink enough water."},
 oiliness:{label:"Oil balance",product:"Niacinamide serum + mattifying SPF",tip:"Use a light, non-comedogenic moisturiser, don’t skip it."},
 pore:{label:"Pores",product:"Niacinamide + weekly clay mask",tip:"Double-cleanse at night to keep pores clear."}
};
const $=id=>document.getElementById(id);let img=null;
new QRCode($("qr"),{text:location.href,width:140,height:140});
$("f").onchange=e=>{const file=e.target.files[0];if(!file)return;const im=new Image();
 im.onload=()=>{const s=Math.min(im.width,im.height);if(s<480){$("msg").textContent="Photo is too small, please use a clearer one.";return}
  const k=Math.min(1,640/s,1280/Math.max(im.width,im.height)),c=document.createElement("canvas");
  c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
  img=c.toDataURL("image/jpeg",.85);$("pv").src=img;$("pv").style.display="block";$("go").disabled=false;$("msg").textContent=""};
 im.src=URL.createObjectURL(file)};
function show(sc,demo){const rows=Object.keys(CONCERNS).filter(k=>k in sc).sort((a,b)=>sc[a]-sc[b]);
 let h='<div class="card"><b>Your skin report</b>'+(demo?' <small>(sample data)</small>':'');
 rows.forEach(k=>h+=`<div class="row"><div class="h"><span>${CONCERNS[k].label}</span><b>${sc[k]}/100</b></div><div class="bar"><i style="width:${sc[k]}%"></i></div></div>`);
 h+='</div><div class="card"><b>Recommended for you</b>';
 rows.slice(0,2).forEach(k=>h+=`<div class="rec"><b>${CONCERNS[k].label}</b><br>${CONCERNS[k].product}<br><small>${CONCERNS[k].tip}</small></div>`);
 $("out").innerHTML=h+'</div>';$("out").scrollIntoView({behavior:"smooth"})}
$("demo").onclick=()=>show({acne:72,moisture:55,oiliness:68,pore:61},true);
$("go").onclick=async()=>{$("go").disabled=true;$("msg").textContent="Analysing, about 20 seconds…";
 try{const r=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:img})});
  const d=await r.json();if(!r.ok)throw new Error(d.error||"Failed");$("msg").textContent="";show(d.scores,false)}
 catch(e){$("msg").textContent=e.message}$("go").disabled=false};
</script></body></html>
